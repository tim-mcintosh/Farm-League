<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a password — Farm League</title>
<link rel="stylesheet" href="../assets/shared/site.css"><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js" defer></script>
<script src="../assets/shared/supabase-config.js" defer></script><script src="../assets/shared/auth.js" defer></script>
<script src="password.js" defer></script>
</head>
<body><header class="account-header"><a href="../index.html">🌿 Farm League</a><a href="../index.html">← Back home</a></header>
<main class="account-main"><section class="account-card"><p class="eyebrow">Account recovery</p><h1>Choose a new password</h1>
<form id="resetForm" class="account-form"><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label><label>Confirm password<input name="confirmation" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label><button type="submit">Update password</button></form>
<p id="accountStatus" class="account-status" role="status" aria-live="polite"></p></section></main></body>
</html>
